name: Sync Node-RED Upstream

on:
  schedule:
    # 必须早于 Build Add-ons 的定时构建（UTC 周日 03:00），
    # 否则同步进来的改动要等一整周才会被构建，期间商店里是装不上的幽灵版本
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-node-red-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync node-red with hassio-addons/app-node-red
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync upstream files and version
        run: python3 node-red/sync_upstream.py

      - name: Commit and push
        run: |
          set -e
          if [ -z "$(git status --porcelain node-red)" ]; then
            echo "已与上游一致，无需提交"
            exit 0
          fi

          version=$(grep -m1 '^version:' node-red/config.yaml | sed 's/version: *//')
          node_red=$(python3 -c "import json;print(json.load(open('node-red/package.json'))['dependencies']['node-red'])")

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add node-red
          git commit -m "chore(node-red): 同步上游，Node-RED ${node_red}（app ${version}）"
          git push
