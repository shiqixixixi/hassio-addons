name: Update Node-RED Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨运行
  workflow_dispatch:  # 允许手动触发

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          # 移除显式路径，让工具自动搜索锁文件
          # 解决找不到锁文件的错误

      - name: Install dependencies and generate lock file
        run: |
          cd hassio-addons/node-red
          # 安装依赖并生成package-lock.json（如果不存在）
          npm install --package-lock-only

      - name: Update packages to latest versions
        run: |
          cd hassio-addons/node-red
          npm install -g npm-check-updates
          ncu -u
          npm install --package-lock-only

      - name: Check for changes
        id: check_changes
        run: |
          cd hassio-addons/node-red
          if git diff --quiet package.json package-lock.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add hassio-addons/node-red/package.json hassio-addons/node-red/package-lock.json
          git commit -m "Auto-update Node-RED packages to latest versions"
          git push
