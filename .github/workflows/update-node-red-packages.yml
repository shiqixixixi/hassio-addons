name: Update Node-RED Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨运行
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许写入内容（推送代码）

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node-RED directory and package.json
        run: |
          echo "Current directory structure:"
          ls -R node-red
          
          # 检查 node-red 目录是否存在
          if [ ! -d "node-red" ]; then
            echo "Error: Directory 'node-red' not found"
            exit 1
          fi
          
          # 检查 package.json 是否存在
          if [ ! -f "node-red/package.json" ]; then
            echo "Error: package.json not found in 'node-red' directory"
            exit 1
          fi
          
          # 打印 package.json 内容（便于调试）
          echo "package.json content:"
          cat node-red/package.json | grep -E '"node-red"|dependencies|devDependencies'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: ''  # 禁用缓存避免锁文件问题

      - name: Install dependencies and generate lock file
        run: |
          cd node-red
          npm install --package-lock-only

      - name: Update packages to latest versions
        run: |
          cd node-red
          npm install -g npm-check-updates
          ncu -u
          npm install --package-lock-only

      - name: Extract Node-RED version from package.json (with fallback)
        id: extract_version
        run: |
          cd node-red
          
          # 方案1：尝试从 dependencies 或 devDependencies 提取（容错处理）
          NODE_RED_VERSION=$(node -p "
            const pkg = require('./package.json');
            pkg.dependencies?.['node-red'] || pkg.devDependencies?.['node-red'] || 'unknown'
          ")
          
          # 检查是否提取成功
          if [ "$NODE_RED_VERSION" = "unknown" ]; then
            echo "Warning: node-red not found in dependencies/devDependencies"
            # 方案2：尝试从 package.json 其他字段提取（如 name 为 node-red 时的 version 字段）
            NODE_RED_VERSION=$(node -p "require('./package.json').version || 'unknown'")
          fi
          
          # 去除版本号前的 ^/~ 符号（容错：如果没有符号则直接保留）
          NODE_RED_VERSION_CLEAN=$(echo "$NODE_RED_VERSION" | sed 's/^[^^~]*//')
          
          # 最终检查：如果仍未提取到版本号，终止流程
          if [ "$NODE_RED_VERSION_CLEAN" = "unknown" ]; then
            echo "Error: Failed to extract Node-RED version from package.json"
            exit 1
          fi
          
          echo "NODE_RED_VERSION=$NODE_RED_VERSION_CLEAN" >> $GITHUB_ENV
          echo "Extracted Node-RED version: $NODE_RED_VERSION_CLEAN"

      - name: Update version in config.yaml (node-red directory)
        run: |
          CONFIG_PATH="./node-red/config.yaml"
          
          # 检查 config.yaml 是否存在
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Error: config.yaml not found at $CONFIG_PATH"
            exit 1
          fi
          
          # 替换版本号（匹配常见字段，可根据实际调整）
          sed -i "s/^\(node_red_version:\|version:\|node-red-version:\).*/\1 $NODE_RED_VERSION/" "$CONFIG_PATH"
          echo "Updated $CONFIG_PATH with Node-RED version: $NODE_RED_VERSION"

      - name: Check for changes
        id: check_changes
        run: |
          CONFIG_PATH="./node-red/config.yaml"
          if git diff --quiet node-red/package.json node-red/package-lock.json "$CONFIG_PATH"; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add node-red/package.json node-red/package-lock.json node-red/config.yaml
          git commit -m "Auto-update Node-RED packages to latest versions (v$NODE_RED_VERSION)"
          git push