name: Update Node-RED Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨运行
  workflow_dispatch:  # 允许手动触发

# 添加必要的权限配置
permissions:
  contents: write  # 允许写入内容（推送代码）

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 使用GitHub令牌解决权限问题
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node-RED directory exists
        run: |
          echo "Current directory structure:"
          ls -R
          
          if [ ! -d "node-red" ]; then
            echo "Error: Directory 'node-red' not found"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: ''  # 禁用缓存避免锁文件问题

      - name: Install dependencies and generate lock file
        run: |
          cd node-red
          npm install --package-lock-only

      - name: Update packages to latest versions
        run: |
          cd node-red
          npm install -g npm-check-updates
          ncu -u
          npm install --package-lock-only

      - name: Check for changes
        id: check_changes
        run: |
          cd node-red
          if git diff --quiet package.json package-lock.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add node-red/package.json node-red/package-lock.json
          git commit -m "Auto-update Node-RED packages to latest versions"
          git push
