name: Update Node-RED Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨运行
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node-RED directory exists
        run: |
          if [ ! -d "node-red" ]; then
            echo "Error: Directory 'node-red' not found"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18.x
          cache: ''

      - name: Update packages to latest versions
        run: |
          cd node-red
          npm install -g npm-check-updates
          ncu -u

      - name: Check for changes
        id: check_changes
        run: |
          cd node-red
          if git diff --quiet package.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump add-on version
        if: steps.check_changes.outputs.changes == 'true'
        id: bump_version
        run: |
          cd node-red
          # 读取当前版本并自增 patch
          current_version=$(grep -oP '(?<=^version: )[0-9]+\.[0-9]+\.[0-9]+' config.yaml)
          IFS='.' read -r major minor patch <<< "$current_version"
          new_version="${major}.${minor}.$((patch + 1))"
          sed -i "s/^version: ${current_version}/version: ${new_version}/" config.yaml
          echo "old_version=${current_version}" >> $GITHUB_OUTPUT
          echo "new_version=${new_version}" >> $GITHUB_OUTPUT
          echo "Bumped version: ${current_version} -> ${new_version}"

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add node-red/package.json node-red/config.yaml
          git commit -m "Auto-update Node-RED packages to v${{ steps.bump_version.outputs.new_version }}"
          git push
