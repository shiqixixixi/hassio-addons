name: Update Node-RED Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨运行
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node-RED directory exists
        run: |
          if [ ! -d "node-red" ]; then
            echo "Error: Directory 'node-red' not found"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: ''

      - name: Update packages to latest versions
        run: |
          cd node-red
          npm install -g npm-check-updates
          ncu -u

      - name: Check for changes
        id: check_changes
        run: |
          cd node-red
          if git diff --quiet package.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump add-on version
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          # 版本号跟随 package.json 里的 node-red 版本（变化时同步，未变化时 patch 自增）
          python3 node-red/sync_upstream.py --version-only

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version=$(grep -m1 '^version:' node-red/config.yaml | sed 's/version: *//')
          git add node-red/package.json node-red/config.yaml
          git commit -m "chore(node-red): 更新依赖并同步版本 ${version}"
          git push
