name: Update Node-RED Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨运行
  workflow_dispatch:  # 允许手动触发

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: 'hassio-addons/node-red/package.json'

      - name: Install dependencies
        run: |
          cd hassio-addons/node-red
          npm install

      - name: Update packages to latest versions
        run: |
          cd hassio-addons/node-red
          # 安装 npm-check-updates 工具
          npm install -g npm-check-updates
          # 更新依赖到最新版本（遵循 semver）
          ncu -u
          # 重新安装以更新 package-lock.json
          npm install --package-lock-only

      - name: Check for changes
        id: check_changes
        run: |
          cd hassio-addons/node-red
          if git diff --quiet package.json package-lock.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add hassio-addons/node-red/package.json hassio-addons/node-red/package-lock.json
          git commit -m "Auto-update Node-RED packages to latest versions"
          git push
