name: Update Node-RED Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨运行
  workflow_dispatch:  # 允许手动触发

# 添加必要的权限配置
permissions:
  contents: write  # 允许写入内容（推送代码）

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node-RED directory exists
        run: |
          echo "Current directory structure:"
          ls -R
          
          if [ ! -d "node-red" ]; then
            echo "Error: Directory 'node-red' not found"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: ''  # 禁用缓存避免锁文件问题

      - name: Install dependencies and generate lock file
        run: |
          cd node-red
          npm install --package-lock-only

      - name: Update packages to latest versions
        run: |
          cd node-red
          npm install -g npm-check-updates
          ncu -u
          npm install --package-lock-only

      - name: Extract Node-RED version from package.json
        id: extract_version
        run: |
          cd node-red
          # 提取 dependencies 或 devDependencies 中的 node-red 版本
          NODE_RED_VERSION=$(node -p "require('./package.json').dependencies['node-red'] || require('./package.json').devDependencies['node-red']")
          # 去除版本号前的 ^/~ 符号
          NODE_RED_VERSION_CLEAN=$(echo $NODE_RED_VERSION | sed 's/^[^^~]*//')
          echo "NODE_RED_VERSION=$NODE_RED_VERSION_CLEAN" >> $GITHUB_ENV
          echo "Extracted Node-RED version: $NODE_RED_VERSION_CLEAN"

      - name: Update version in config.yaml (node-red directory)
        run: |
          # 明确 config.yaml 路径（与 package.json 同级，在 node-red 目录下）
          CONFIG_PATH="./node-red/config.yaml"
          
          # 检查文件是否存在，避免报错
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Error: config.yaml not found at $CONFIG_PATH"
            exit 1
          fi
          
          # 替换版本号（匹配 config.yaml 中常见的版本字段，可根据实际调整正则）
          sed -i "s/^\(node_red_version:\|version:\|node-red-version:\).*/\1 $NODE_RED_VERSION/" "$CONFIG_PATH"
          echo "Updated $CONFIG_PATH with Node-RED version: $NODE_RED_VERSION"

      - name: Check for changes
        id: check_changes
        run: |
          # 检查三个文件的变更：package.json、package-lock.json、config.yaml
          CONFIG_PATH="./node-red/config.yaml"
          if git diff --quiet node-red/package.json node-red/package-lock.json "$CONFIG_PATH"; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 提交所有变更文件
          git add node-red/package.json node-red/package-lock.json node-red/config.yaml
          git commit -m "Auto-update Node-RED packages to latest versions (v$NODE_RED_VERSION)"
          git push