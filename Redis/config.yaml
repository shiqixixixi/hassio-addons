name: Redis
version: "7.2.4"
slug: redis_server
description: A Redis server for Home Assistant, providing in-memory data storage.
url: "https://github.com/shiqixixixi/hassio-addons"
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: auto
ports:
  6379/tcp: 6379
ports_description:
  6379/tcp: Redis server port
options:
  max_memory: "128mb"  # 默认值，必须带单位（mb/gb）
  require_pass: ""     # 默认空密码
  appendonly: false
schema:
  max_memory: str
  require_pass: str
  appendonly: bool
environment:
  # 关键：HassOS会将options中的值注入到这些环境变量中
  HASS_MAX_MEMORY: "{{ max_memory }}"    # 用双大括号+空格，严格遵循HA模板语法
  HASS_REQUIRE_PASS: "{{ require_pass }}"
  HASS_APPENDONLY: "{{ appendonly }}"
  TZ: "{{ TZ }}"  # 继承HA时区