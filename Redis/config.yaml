name: Redis
version: "7.2.4"
slug: redis_server
description: A Redis server for Home Assistant, providing in-memory data storage.
url: "https://github.com/shiqixixixi/hassio-addons"
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: auto
ports:
  6379/tcp: 6379
ports_description:
  6379/tcp: Redis server port
options:
  max_memory: "128mb"
  require_pass: ""
  appendonly: false  # 改为布尔值（true/false），更符合 HA 规范
schema:
  max_memory: str
  require_pass: str
  appendonly: bool  # 修正：使用 bool 类型校验（替换 yes|no）
environment:  # 修正：改为字典格式
  TZ: "${TZ}"  # 键值对形式，继承 HA 时区