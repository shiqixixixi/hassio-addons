name: Redis
version: "7.2.4"
slug: redis_server
description: A Redis server for Home Assistant, providing in-memory data storage.
url: "https://github.com/shiqixixixi/hassio-addons"
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: auto
ports:
  6379/tcp: 6379
ports_description:
  6379/tcp: Redis server port
options:
  max_memory: "128mb"
  require_pass: ""
  appendonly: false
schema:
  max_memory: str
  require_pass: str
  appendonly: bool
environment:
  TZ: "${TZ}"
  # 关键补充：将HA加载项配置映射为run.sh能识别的环境变量
  MAX_MEMORY: "${max_memory}"
  REQUIRE_PASS: "${require_pass}"
  APPENDONLY: "${appendonly}"