name: Redis
version: "latest"
slug: redis_server
description: A Redis server for Home Assistant, providing in-memory data storage.
url: "https://github.com/shiqixixixi/hassio-addons"
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: auto
map:                         # 目录映射（宿主机目录→容器目录，确保数据持久化）
  - config: /data            # HA的config目录映射到容器的/data（存储options.json和应用数据）
  - addon_config: /config    # （可选）加载项专属配置目录
ports:
  6379/tcp: 6379
ports_description:
  6379/tcp: Redis server port
options:
  max_memory: "128mb"        # 普通字符串字段
  require_pass: ""           # 普通字符串字段
  appendonly: false          # 普通布尔字段
schema:
  max_memory: str
  require_pass: str
  appendonly: bool