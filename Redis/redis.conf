# 极简Redis配置文件 - 仅包含最基本必要的设置

# 基础设置
daemonize no
pidfile /tmp/redis.pid
port 6379
bind 0.0.0.0
timeout 0
tcp-keepalive 300

# 持久化设置（注意：dir将通过命令行参数动态指定）
dbfilename dump.rdb
appendonly no

# 内存管理
maxmemory 128mb
maxmemory-policy allkeys-lru

# 安全设置
protected-mode no

# 日志设置
loglevel notice
logfile ""

# 数据库设置
databases 16

# RDB持久化配置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 客户端连接设置
maxclients 10000

# 内存采样设置
maxmemory-samples 5

# 禁用模块加载相关配置，避免模块检测错误
# 注意：所有与模块相关的配置都被移除，避免自动加载模块

# 基本的键值编码优化
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# 其他必要设置
activerehashing yes
latency-monitor-threshold 0
notify-keyspace-events ""