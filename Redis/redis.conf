# 最小化的Redis配置文件
# 基础设置
daemonize no
# 修改pidfile路径到可写目录
pidfile /tmp/redis.pid
port 6379
bind 0.0.0.0
timeout 0
tcp-keepalive 300

# 持久化设置
# 注意：dir将通过命令行参数动态指定
dbfilename dump.rdb
appendonly no

# 内存管理
maxmemory 128mb
maxmemory-policy allkeys-lru

# 安全设置
protected-mode no

# 基础配置
tcp-backlog 511
loglevel notice
logfile ""
databases 16

# RDB持久化设置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 基本网络设置
repl-disable-tcp-nodelay no

# 客户端设置
maxclients 10000

# 内存优化设置
maxmemory-samples 5

# 键值编码优化
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# 其他基本设置
activerehashing yes
latency-monitor-threshold 0
notify-keyspace-events ""